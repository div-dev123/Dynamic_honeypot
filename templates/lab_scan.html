<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Scan Lab | Neural Honeypot</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="cyber-header">
        <div class="cyber-container">
            <nav class="navbar navbar-expand-lg navbar-dark cyber-navbar">
                <a class="navbar-brand glow-text" href="/">
                    <i class="fas fa-brain"></i> NEURAL HONEYPOT
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="/attack_summary"><i class="fas fa-shield-alt"></i> THREAT DASHBOARD</a></li>
                        <li class="nav-item"><a class="nav-link" href="/map"><i class="fas fa-globe"></i> THREAT MAP</a></li>
                        <li class="nav-item"><a class="nav-link" href="/analysis"><i class="fas fa-chart-line"></i> ANALYSIS</a></li>
                        <li class="nav-item"><a class="nav-link" href="/webapp"><i class="fas fa-user-shield"></i> DECOY WEB APP</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/lab"><i class="fas fa-flask"></i> ATTACK LAB</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <section class="cyber-container">
        <div class="cyber-card">
            <h1 class="cyber-heading glow-text"><i class="fas fa-network-wired"></i> PORT SCAN LAB</h1>
            <p class="cyber-text">Simulate a port scan against common services.</p>

            {% if submitted %}
            <div class="alert alert-success" role="alert">
                Simulated scan logged. Check the Threat Dashboard for the new event.
            </div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label class="cyber-text">Ports (comma separated)</label>
                    <input type="text" class="form-control" name="ports" value="{{ ports or '22,80,443,8080,33060,2121,2323,2525' }}" />
                </div>
                <div class="form-group">
                    <label class="cyber-text">Scan Rate</label>
                    <select class="form-control" name="rate">
                        <option value="slow" {% if rate == 'slow' %}selected{% endif %}>slow</option>
                        <option value="normal" {% if rate == 'normal' %}selected{% endif %}>normal</option>
                        <option value="fast" {% if rate == 'fast' %}selected{% endif %}>fast</option>
                        <option value="aggressive" {% if rate == 'aggressive' %}selected{% endif %}>aggressive</option>
                    </select>
                </div>
                <button class="cyber-btn" type="submit"><i class="fas fa-play"></i> LOG SCAN</button>
                <a class="cyber-btn ml-2" href="/lab"><i class="fas fa-arrow-left"></i> BACK</a>
            </form>
        </div>
    </section>

    <footer class="cyber-footer">
        <div class="cyber-container">
            <p class="cyber-text"><i class="fas fa-flask"></i> Attack Lab</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
